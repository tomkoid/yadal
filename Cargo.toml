[package]
name = "yadal"
version = "0.3.0"
edition = "2024"
rust-version = "1.89.0"
publish = false

[profile.rpm]
inherits = "release"

[dependencies]
tokio = { version = "1.46.1", features = ["full", "rt"] }
clap = { version = "4.5", features = ["derive", "string"] }
futures = "0.3"
sanitize-filename = "0.6"
bytes = "1.9"
serde_json = "1.0"
anyhow = "1.0"
indicatif = "0.17"
tidlers = { git = "https://codeberg.org/tomkoid/tidlers", rev = "cdf6a8d141b6a4708003c07cfdc76c24bde2c611" }
# tidlers = { path = "/home/tom/Coding/rust/tidlers" }
directories = "5.0"
dirs = "6.0.0"
reqwest = { version = "0.13.4", features = ["stream"] }
crossterm = "0.29.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4"] }
toml = "1.1.6"
serde = "1.0.229"
thiserror = "2.0.21"
regex = "1.13.1"
minijinja = "2.24.0"
lofty = "0.25.4"
