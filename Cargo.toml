[package]
name = "yadal"
version = "0.3.0"
edition = "2024"
publish = false

[profile.rpm]
inherits = "release"

[dependencies]
tokio = { version = "1.46.1", features = ["full", "rt"] }
clap = { version = "4.5", features = ["derive", "string"] }
futures = "0.3"
sanitize-filename = "0.6"
bytes = "1.9"
serde_json = "1.0"
anyhow = "1.0"
indicatif = "0.17"
multitag = { git = "https://github.com/tomkoid/multitag" } 
tidlers = { git = "https://codeberg.org/tomkoid/tidlers", rev = "b71d460c9c5ebf2dbcb6dd60657bddb15fcd1b62" }
# tidlers = { path = "/home/tom/Coding/rust/tidlers" }
directories = "5.0"
dirs = "6.0.0"
reqwest = { version = "0.13.4", features = ["stream"] }
which = "8.0.5"
crossterm = "0.29.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
